<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CheckBook - 도서관·전자도서관·구독·서점을 한 번에</title>
    <meta name="description" content="책 한 권을 검색하면 공공도서관 소장·대출, 전자도서관, 밀리 구독, 중고·새 책 가격을 한 화면에서 보여 드려요." />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 공유 미리보기(카카오톡·X 등). 미리보기 봇은 스크립트를 돌리지 않아 책 상세 링크도 이 공통 값이 보인다.
         og:url은 넣지 않는다 — 넣으면 상세 링크를 공유해도 홈 주소로 보인다. 이미지를 바꾸면 ?v= 숫자를 올린다(카카오가 주소별로 캐시) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CheckBook" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="CheckBook - 읽고 싶은 책, 어디서 읽을까요?" />
    <meta property="og:description" content="책 한 권을 검색하면 공공도서관 소장·대출, 전자도서관, 밀리 구독, 중고·새 책 가격을 한 화면에서 보여 드려요." />
    <meta property="og:image" content="https://checkbook.site/og-image.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CheckBook — 읽고 싶은 책, 어디서 읽을까요?" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Pretendard Variable 동적 서브셋: 화면에 쓰인 글자 조각만 받고(조각마다 font-display: swap), 굵기 400·500·700을 파일 하나로 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
