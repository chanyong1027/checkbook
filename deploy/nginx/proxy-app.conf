# 앱(블루·그린 중 지금 칸)으로 넘긴다 → 서버 /etc/nginx/checkbook/proxy-app.conf
proxy_pass http://checkbook_app;

proxy_set_header Host              $host;
# $remote_addr는 cloudflare-realip.conf가 복원한 실제 사용자 IP다.
# X-Forwarded-For는 덧붙이지 않고 덮어쓴다(사용자가 보낸 값을 그대로 넘기면 앱 쪽 IP 제한을 속일 수 있다)
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;
# 앱(forward-headers-strategy: framework)은 RFC 7239 Forwarded를 X-Forwarded-*보다 먼저 읽는다.
# 사용자가 보낸 Forwarded·X-Forwarded-Prefix가 그대로 넘어가면 IP·호스트를 속일 수 있어 비운다
proxy_set_header Forwarded          "";
proxy_set_header X-Forwarded-Prefix "";
