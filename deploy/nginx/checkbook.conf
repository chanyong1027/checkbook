# CheckBook 사이트 설정 → 서버 /etc/nginx/sites-available/checkbook (sites-enabled에 링크)
#
# 앞단은 Cloudflare(Full strict)다. 보안 목록이 Cloudflare 대역만 80·443을 열어 두고, 원 서버 인증서는
# Cloudflare Origin CA다. 같이 쓰는 파일(서버 /etc/nginx/checkbook/):
#   cloudflare-realip.conf  실제 사용자 IP 복원(limit_req가 IP별로 세려면 필수)
#   security-headers.conf   보안 헤더(add_header는 location에서 새로 쓰면 상속이 끊겨 include로 반복한다)
#   upstream.conf           지금 서비스 중인 칸과 $checkbook_slot(deploy.sh가 쓴다. 손으로 고치지 않는다)

include /etc/nginx/checkbook/cloudflare-realip.conf;
include /etc/nginx/checkbook/upstream.conf;

# 요청 제한(OCI 이전 결정 Q3). IP당 홍수(속도) 방지용이다. 하루 총량(IP당 500회)과 공급자 하루 예산은 앱 안 요청 제한이 지킨다
# (application.yaml rate-limit, 결정 2026-10-18).
# 처음엔 dry run(막지 않고 '막혔을 요청'만 error.log에 남김). 사이트를 알리기 전에 로그를 숫자로 보고 끈다(deploy/README.md)
limit_req_zone $binary_remote_addr zone=checkbook_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=checkbook_search:10m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;
limit_req_dry_run on;

server_tokens off;

# 지금 칸 헤더는 서버 안(deploy.sh의 확인 요청)에만 보낸다. 값이 비면 add_header가 헤더를 내보내지 않는다
map $remote_addr $checkbook_slot_header {
    127.0.0.1 $checkbook_slot;
    default   "";
}

# 알 수 없는 Host(서버 IP 직접 접속, 다른 도메인)는 응답하지 않는다
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
}

# HTTP → HTTPS (Cloudflare Always Use HTTPS가 먼저 처리하지만 원 서버도 같은 규칙을 둔다)
server {
    listen 80;
    listen [::]:80;
    server_name checkbook.site www.checkbook.site;
    return 301 https://checkbook.site$request_uri;
}

server {
    # 서버 nginx는 1.24(Ubuntu 24.04)라 `http2 on;`(1.25.1+) 대신 listen에 붙인다
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.checkbook.site;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    return 301 https://checkbook.site$request_uri;
}

server {
    # 서버 nginx는 1.24(Ubuntu 24.04)라 `http2 on;`(1.25.1+) 대신 listen에 붙인다
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name checkbook.site;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/checkbook;
    index index.html;

    include /etc/nginx/checkbook/security-headers.conf;
    # 지금 칸(blue/green). upstream.conf의 map이 정한다. deploy.sh가 전환 적용 여부를 이 헤더로 확인한다
    # (/api/처럼 add_header가 없는 location에만 상속된다)
    add_header X-Checkbook-Slot $checkbook_slot_header always;

    # 경로에 ';'가 있으면 거부한다. Nginx는 ';'를 평범한 글자로 보지만 Tomcat은 세그먼트의 ';'부터 다음 '/'까지를
    # 경로 파라미터로 떼어 내서, /api/search;x가 `location = /api/search`의 검색 제한을 피해 같은 컨트롤러에 닿는다.
    # 우리 경로는 ';'를 쓰지 않는다. $uri는 디코딩된 경로라 %3B도 걸리고, 쿼리 문자열은 보지 않는다.
    # (';'에 대해서는 Spring Security StrictHttpFirewall의 기본 동작과 같다. 이 앱은 Spring Security를 쓰지 않는다)
    # /api/search/(끝 슬래시)는 Spring 6부터 끝 슬래시를 맞추지 않는 기본값이라 컨트롤러에 닿지 않는다
    if ($uri ~ ";") {
        return 400;
    }

    # limit_req가 막은 요청도 앱 오류와 같은 JSON으로 돌려준다(기본은 HTML이라 프런트가 일반 오류 문구만 보였다).
    # Nginx가 만든 429에만 걸린다 — 앱이 보낸 429(하루 한도, Retry-After 포함)는 proxy_intercept_errors가 꺼져 있어 그대로 지나간다
    error_page 429 = @rate_limited;
    location @rate_limited {
        include /etc/nginx/checkbook/security-headers.conf;
        default_type "application/json; charset=utf-8";
        add_header Retry-After 1 always;
        return 429 '{"code":"RATE_LIMIT_EXCEEDED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요."}';
    }

    # 관리 엔드포인트는 밖으로 내보내지 않는다(헬스 확인은 deploy.sh가 127.0.0.1로 직접 부른다)
    location /actuator {
        return 404;
    }

    location = /api/search {
        limit_req zone=checkbook_search burst=10 nodelay;
        limit_req zone=checkbook_api burst=20 nodelay;
        include /etc/nginx/checkbook/proxy-app.conf;
    }

    location /api/ {
        limit_req zone=checkbook_api burst=20 nodelay;
        include /etc/nginx/checkbook/proxy-app.conf;
    }

    # Vite 빌드 산출물은 파일 이름에 해시가 붙어 내용이 바뀌면 이름도 바뀐다 → 오래 캐시
    location /assets/ {
        include /etc/nginx/checkbook/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: 없는 경로는 index.html로. index.html은 매번 새로 받게 해 새 배포가 바로 보이게 한다
    location / {
        include /etc/nginx/checkbook/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
