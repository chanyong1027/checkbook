# 보안 헤더 → 서버 /etc/nginx/checkbook/security-headers.conf
# 기준: OWASP HTTP Headers Cheat Sheet. add_header가 있는 location에서는 다시 include해야 한다(상속이 끊긴다)

# HTTPS만 쓰게 한다(1년). 서브도메인·preload는 쓰지 않는다(다른 서브도메인 계획이 없고 되돌리기 어렵다)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 다른 사이트가 iframe으로 감싸지 못하게 한다. CSP는 이것만 건다(스크립트·폰트 출처 제한은 화면 확인 후 별도로)
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# 위치는 상세 화면의 가까운 도서관 찾기가 쓴다
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
