plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.checkbook'
version = '0.0.1-SNAPSHOT'
description = 'Book integrated search platform'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
	// Boot 4: starter-aop → starter-aspectj (Resilience4j @CircuitBreaker가 AOP 프록시 필요)
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	// Boot 4: Flyway 자동 설정은 전용 스타터가 있어야 동작
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Boot 4: starter-web → starter-webmvc
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.jsoup:jsoup:1.17.2'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Boot 4: 테스트 슬라이스가 모듈별 스타터로 분리됨
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'      // @WebMvcTest, TestRestTemplate
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'    // @DataJpaTest
	testImplementation 'org.springframework.boot:spring-boot-starter-micrometer-metrics-test' // @AutoConfigureMetrics
	testImplementation 'org.springframework.boot:spring-boot-restclient'               // TestRestTemplate 런타임 의존
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		// 타이밍(sleep) 의존 동시성 재현 테스트는 기본 스위트에서 제외 —
		// 배포 CI가 test를 돌리므로 스케줄링 지연으로 인한 위양성이 배포를 막지 않게
		excludeTags 'diagnosis'
	}
}

tasks.register('diagnosisTest', Test) {
	description = '동시성 재현 테스트 (타이밍 의존 — 기본 test에서 제외된 것들)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'diagnosis'
	}
}
