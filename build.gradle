plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.checkbook'
version = '0.0.1-SNAPSHOT'
description = 'Book integrated search platform'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	// JDK 21부터 실행 중 동적 에이전트 로딩에 경고가 나고, 이후 JDK에서는 기본 차단된다.
	// Mockito inline mock maker를 테스트 JVM 시작 시 -javaagent로 붙인다 (Mockito 공식 권장 방식)
	mockitoAgent
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
	// Boot 4: starter-aop → starter-aspectj (Resilience4j @CircuitBreaker가 AOP 프록시 필요)
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	// Boot 4: Flyway 자동 설정은 전용 스타터가 있어야 동작
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Boot 4: starter-web → starter-webmvc
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Boot 4: RestClient.Builder 자동 설정(+ http.client.requests 관측)이 별도 모듈로 분리됨.
	// 주입 빌더를 쓰는 클라이언트(YES24)가 운영에서 Bean을 받으려면 main 의존성이어야 한다.
	// TestRestTemplate도 이 모듈을 쓰지만 testImplementation으로 따로 두지 않는다 — 테스트에서만 Bean이 생기면
	// 운영 기동 실패를 CI가 잡지 못한다
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.jsoup:jsoup:1.17.2'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Boot 4: 테스트 슬라이스가 모듈별 스타터로 분리됨
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'      // @WebMvcTest, TestRestTemplate
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'    // @DataJpaTest
	testImplementation 'org.springframework.boot:spring-boot-starter-micrometer-metrics-test' // @AutoConfigureMetrics
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	// PostgreSQL에서만 보이는 동작(같은 키 INSERT 대기·23505·ON CONFLICT)을 실제 DB로 시험한다(T4 결정 카드 10).
	// 버전은 Boot가 관리(Testcontainers 2.x — 모듈 이름이 testcontainers-*). 컨테이너는 postgresTest 작업만 띄운다
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'   // @ServiceConnection
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	mockitoAgent('org.mockito:mockito-core') { transitive = false }
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
	jvmArgs("-javaagent:${configurations.mockitoAgent.asPath}")
}

tasks.named('test') {
	useJUnitPlatform {
		// 타이밍(sleep) 의존 동시성 재현 테스트와 출력 전용 벤치마크는 기본 스위트에서 제외 —
		// CI가 PR마다 test를 돌리므로 스케줄링 지연으로 인한 위양성이 PR을 막지 않게.
		// contract는 실제 외부 API를 부르므로 PR마다 돌리지 않는다(주 1회 contract-check.yml)
		// postgres는 Docker로 실제 PostgreSQL을 띄운다 — 소켓 없는 실행기에서도 test가 돌게 따로 뺀다(postgresTest)
		excludeTags 'diagnosis', 'benchmark', 'contract', 'postgres'
	}
}

tasks.register('postgresTest', Test) {
	description = '실제 PostgreSQL(Testcontainers) 시험 — 같은 키 INSERT 대기·23505·ON CONFLICT·Flyway 마이그레이션(Docker 필요)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'postgres'
	}
	shouldRunAfter 'test'
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
	// Gradle 8은 시험이 0개여도 성공한다 — 태그를 잘못 적으면 PostgreSQL 시험이 하나도 안 돌았는데 CI가 초록이 된다
	// (Gradle 9부터는 '시험 소스가 있는데 하나도 안 돌면 실패'가 기본이라, 올리면 이 훅은 지워도 된다)
	afterSuite { desc, result ->
		if (desc.parent == null && result.testCount == 0) {
			throw new GradleException('postgresTest가 시험을 하나도 돌리지 않았다 — @Tag("postgres")·PostgresIntegrationTest 상속을 확인')
		}
	}
}

// 둘 다 돌려야 '검증 끝'이다. CI는 test와 postgresTest를 따로 부른다(ci-backend.yml)
tasks.named('check') {
	dependsOn 'postgresTest'
}

tasks.register('diagnosisTest', Test) {
	description = '동시성 재현 테스트 (타이밍 의존 — 기본 test에서 제외된 것들)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'diagnosis'
	}
}

tasks.register('contractTest', Test) {
	description = '외부 공급자 계약 확인 (실제 API 호출 — 기본 test에서 제외, 주 1회 GitHub Actions)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'contract'
	}
	// 입력(코드)이 같아도 바깥 상태가 바뀌었을 수 있으니 매번 실제로 돈다
	outputs.upToDateWhen { false }
	// 실패 메시지(어느 단계가 왜)가 Actions 로그에 바로 보이게
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
}

tasks.register('benchmarkTest', Test) {
	description = '출력 전용 벤치마크 (검증 없음 — 기본 test에서 제외)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'benchmark'
	}
}
