name: CI Backend

# PR마다 백엔드 테스트를 돌린다. 배포는 하지 않는다(이미지는 backend-image.yml, 서버 배포는 deploy/deploy.sh).
# 기본 test는 타이밍 의존 재현 테스트(diagnosis), 출력 전용 벤치마크(benchmark), 실제 외부 API 계약 확인(contract)을 제외한다.
# diagnosisTest는 위양성 가능성이 있어 수동 실행(workflow_dispatch)에서만 돈다.
# 실제 외부 API를 부르는 계약 확인(contract)은 contract-check.yml이 주 1회 돌린다.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR은 새 커밋이 오면 이전 실행을 취소하고, main push는 커밋마다 결과를 남긴다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 공개 저장소라 PR로 gradle-wrapper.jar가 바뀌어 들어오는 것을 막는다
      - name: Gradle wrapper 검증
        uses: gradle/actions/wrapper-validation@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 테스트
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: 동시성 재현 테스트 (수동 실행 시에만)
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew diagnosisTest --no-daemon

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
