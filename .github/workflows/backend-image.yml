name: Backend Image

# 백엔드 이미지를 ARM64로 빌드해 GHCR(공개)에 올린다. 서버 배포는 하지 않는다.
# 배포는 요약 화면의 digest로 서버 deploy 폴더에서 `sudo ./deploy.sh sha256:...`를 직접 실행한다(OCI 이전 결정 카드 1·3·12, Q5).
# 자동 배포(Actions → SSH)는 PR-O2에서 이 뒤에 붙인다.
# 액션은 버전 태그가 아니라 커밋 SHA로 고정한다(태그는 옮겨 붙일 수 있어 공급망 공격 경로가 된다).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend-image.yml'
      - '.github/trivy/**'
  workflow_dispatch:

# 커밋마다 따로 돈다(같은 그룹이면 대기 중인 실행이 다음 push에 밀려 취소된다)
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    # 서버가 ARM64(OCI A1)라 ARM 러너에서 에뮬레이션 없이 빌드한다(카드 1)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # GITHUB_TOKEN으로 GHCR push. 오래 쓰는 레지스트리 토큰을 두지 않는다
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 공개 저장소라 gradle-wrapper.jar가 바뀌어 들어오는 것을 막는다(이미지 빌드도 이 wrapper를 쓴다)
      - name: Gradle wrapper 검증
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Java 21 설정
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 테스트를 통과한 커밋만 이미지를 남긴다(Dockerfile은 -x test로 빌드)
      - name: 테스트
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR 로그인
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA 태그 = 커밋에서 이미지를 찾는 지름길. revision 라벨(기본 포함) = 이미지에서 커밋을 찾는 기록
      - name: 태그·라벨
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: 빌드·push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 결과 표시용(실패시키지 않음): HIGH 이상을 표로 남긴다
      # push한 digest는 이미지 + provenance 증명을 묶은 index다. Trivy는 플랫폼을 안 주면 linux/amd64를 찾아
      # 실패하므로 arm64를 지정한다
      - name: 취약점 목록 (HIGH 이상, 표시만)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'

      # 관문: 고칠 버전이 있는 CRITICAL이 있으면 실패. 이때는 digest를 요약에 남기지 않는다(Q4)
      # 예외는 우리 앱에서 닿지 않는 것이 확인된 것만, 버전·만료일을 걸어 .github/trivy/gate-ignore.yaml에 둔다
      - name: 취약점 관문 (고칠 수 있는 CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .github/trivy/gate-ignore.yaml
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      - name: 배포용 digest 요약
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### 배포할 이미지"
            echo ""
            echo "- 커밋: \`${GITHUB_SHA}\`"
            echo "- 태그: \`${TAGS}\`"
            echo "- digest: \`${DIGEST}\`"
            echo ""
            echo "서버에서:"
            echo ""
            echo '```'
            echo "sudo ./deploy.sh ${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
