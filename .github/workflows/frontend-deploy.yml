name: Frontend Deploy

# 프런트를 빌드·테스트하고 산출물 이미지(FROM scratch, 빌드 결과만)를 GHCR(공개)에 올린 뒤 서버에 자동 배포한다
# (PR-O2 결정 카드 5·7. 옛 S3 + CloudFront 배포를 대체).
# - 서버 래퍼가 이미지에서 /site를 꺼내 구조를 검사하고 릴리스 폴더로 옮긴 뒤 /var/www/checkbook 링크를 바꾼다.
#   옛 해시 asset은 공용 폴더에 남아 교체 직후에도 404가 나지 않는다.
# - 정적 파일 이미지는 OS 패키지가 없어 Trivy 관문을 두지 않는다. 빌드·테스트를 통과한 것만 push한다.
# - 되돌리기·재배포: digest를 넣어 수동 실행하면 빌드 없이 `frontend rollback`만 한다.
# 액션은 커밋 SHA로 고정하고, SSH는 run:에서 직접 부른다(backend-image.yml과 같은 이유).
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      digest:
        description: '되돌리기·재배포할 산출물 digest(sha256:...). 비우면 이 브랜치를 빌드해 자동 배포'
        required: false
        default: ''

concurrency:
  # 수동 실행(되돌리기)은 실행마다 따로 둔다(같은 커밋의 빌드 뒤에서 기다리거나 서로 취소하지 않게)
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  artifact:
    if: github.event_name != 'workflow_dispatch' || inputs.digest == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 단위 테스트
        working-directory: frontend
        run: npm test

      # API는 같은 도메인의 /api라 VITE_API_BASE_URL을 두지 않는다
      - name: 타입 검사 + 빌드
        working-directory: frontend
        run: npm run build

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR 로그인
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # revision 라벨 = 서버 래퍼가 main 조상·순서를 확인하는 커밋
      - name: 태그·라벨
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short

      # RUN이 없어 에뮬레이션 없이 서버 플랫폼(ARM64)으로 만든다(서버에서 플랫폼 경고 없이 pull)
      - name: 산출물 이미지 빌드·push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend/dist
          file: frontend/artifact.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: digest 요약
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### 배포할 프런트 산출물"
            echo ""
            echo "- 커밋: \`${GITHUB_SHA}\`"
            echo "- 태그: \`${TAGS}\`"
            echo "- digest: \`${DIGEST}\`"
            echo ""
            echo "되돌리기·재배포는 Actions에서 이 워크플로를 수동 실행하고 digest 칸에 넣는다."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: artifact
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.artifact.result == 'success' ||
       (needs.artifact.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.digest != ''))
    runs-on: ubuntu-24.04
    # 서버 유닛 상한(30분) + 정지 대기(3분) + 여유. 짧으면 job만 먼저 끝나 대기 중인 다음 배포가 "이미 진행 중"으로 빠진다
    timeout-minutes: 40
    environment: production
    # 백엔드와 그룹을 나눈다(같은 그룹이면 서로의 대기 실행을 취소한다 — 결정 카드 7)
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
      queue: max
    steps:
      - name: SSH로 배포
        env:
          AUTO_DIGEST: ${{ needs.artifact.outputs.digest }}
          INPUT_DIGEST: ${{ inputs.digest }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER }}   # 비밀이 아니다. 시크릿이면 로그의 모든 "deploy" 글자가 ***로 가려진다
          SSH_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${AUTO_DIGEST}" ]]; then action=deploy digest="${AUTO_DIGEST}"; else action=rollback digest="${INPUT_DIGEST}"; fi
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest 형식이 아닙니다: ${digest}"; exit 1; }
          umask 077
          dir="$(mktemp -d)"
          trap 'rm -rf "${dir}"' EXIT
          # 시크릿을 웹 화면에 붙여 넣으면 앞뒤 공백·줄바꿈(\r 포함)이 섞이기 쉽다. 그러면 호스트 키 확인이
          # "No ED25519 host key is known"으로만 실패해 원인을 알기 어렵다. 앞뒤를 지우고 형식을 본다(값은 찍지 않는다)
          SSH_HOST="$(printf '%s' "${SSH_HOST}" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "${SSH_USER}" | tr -d '[:space:]')"
          read -r key_type key_body _ <<<"$(printf '%s' "${SSH_HOST_KEY}" | tr -d '\r')" || true
          [[ "${SSH_HOST}" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "DEPLOY_HOST 시크릿 형식이 아닙니다(IP나 호스트 이름만. 사용자명·포트·따옴표 없이)"; exit 1; }
          [[ "${SSH_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "DEPLOY_USER 변수가 비었거나 형식이 아닙니다(Environment variables)"; exit 1; }
          [[ "${key_type:-}" == ssh-ed25519 ]] || { echo "DEPLOY_HOST_KEY 시크릿의 첫 칸이 ssh-ed25519가 아닙니다(서버의 /etc/ssh/ssh_host_ed25519_key.pub 앞 두 칸)"; exit 1; }
          [[ "${key_body:-}" =~ ^AAAA[A-Za-z0-9+/]+=*$ ]] || { echo "DEPLOY_HOST_KEY 시크릿의 둘째 칸이 키 본문(AAAA…)이 아닙니다"; exit 1; }
          printf '%s\n' "${SSH_KEY}" | tr -d '\r' >"${dir}/key"
          grep -q -- '-----BEGIN OPENSSH PRIVATE KEY-----' "${dir}/key" || { echo "DEPLOY_SSH_KEY 시크릿이 OpenSSH 개인 키가 아닙니다(-----BEGIN부터 -----END까지 통째로)"; exit 1; }
          # 서버에서 직접 확인한 호스트 키 한 줄. 매번 ssh-keyscan으로 받으면 확인을 끄는 것과 같다(결정 카드 8)
          printf '%s %s %s\n' "${SSH_HOST}" "${key_type}" "${key_body}" >"${dir}/known_hosts"
          echo "frontend ${action} ${digest}"
          ssh -i "${dir}/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${dir}/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" "frontend ${action} ${digest}"
