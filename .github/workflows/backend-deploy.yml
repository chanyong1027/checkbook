name: Backend Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'Dockerfile'
      - 'scripts/deploy.sh'
      - '.github/workflows/backend-deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 및 Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/checkbook:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/checkbook:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/checkbook:buildcache,mode=max

      # SSH(22번 포트) 대신 SSM Run Command로 배포 — 인바운드 포트 개방 불필요.
      # deploy.sh 복사(scp)는 public repo raw URL curl로 대체.
      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: EC2에 배포 (SSM Run Command)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "checkbook backend deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters 'commands=[
              "set -e",
              "curl -fsSL https://raw.githubusercontent.com/chanyong1027/checkbook/main/scripts/deploy.sh -o /home/ubuntu/deploy.sh",
              "chmod +x /home/ubuntu/deploy.sh",
              "bash /home/ubuntu/deploy.sh"
            ]' \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $COMMAND_ID"

          # 배포 스크립트가 헬스체크 대기(30s+)를 포함하므로 기본 waiter 대신 수동 폴링 (최대 10분).
          # send-command 직후는 최종 일관성 공백으로 InvocationDoesNotExist가 날 수 있고,
          # GitHub Actions 기본 셸(bash -e)에서는 그 에러가 스텝을 즉사시키므로
          # 조회 실패를 Pending으로 간주해 재시도한다.
          sleep 5
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "=== 배포 stdout ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "=== 배포 stderr ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패: 상태=$STATUS"
            exit 1
          fi
          echo "배포 성공"
