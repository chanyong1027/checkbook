spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# 외부 API 키는 비면 기동이 멈춘다(@NotBlank). 테스트는 실제 호출을 하지 않으니 더미 값을 둔다.
# 공급자 주소는 아무도 받지 않는 곳(127.0.0.1:9 — 즉시 연결 거절)으로 — 실수로 불러도 인터넷으로 안 나가게.
# 지금까지는 "H2 표에 메인 추천 시드 행이 없어 앱 시작 워밍업이 바로 끝난다"는 우연에 기대 안전했다.
# Flyway를 켠 PostgreSQL 시험에서 시드 행이 생기자 워밍업이 실제 정보나루를 불렀다(10-21). 이 프로필을 얹는 시험 전부에 적용된다
kakao:
  book:
    rest-api-key: test-key
    base-url: http://127.0.0.1:9

yes24:
  api-key: test-key
  base-url: http://127.0.0.1:9

datanaru:
  auth-key: test-key
  base-url: http://127.0.0.1:9/api
  timeout: 2000

millie:
  base-url: http://127.0.0.1:9

search:
  total-deadline: 2800
  public-library-page-size: 5
  public-library-max-count: 20
  public-library-fanout-timeout: 2200
  # 부하 사이징과 무관 — 테스트 컨텍스트용으로 의도적으로 작게 유지 (운영 값은 application.yaml)
  executor-pool-size: 3
  executor-queue-capacity: 8

public-library:
  bootstrap-enabled: false
  executor-pool-size: 20
  executor-queue-capacity: 20

elibrary:
  thread-pool-size: 5
  queue-capacity: 10
  per-library-timeout: 5000
  total-timeout: 20000
  contract-check:
    enabled: false

cors:
  allowed-origins: http://localhost:3000

resilience4j:
  circuitbreaker:
    instances:
      datanaru:
        sliding-window-size: 2
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
        permitted-calls-in-half-open-state: 1
        ignore-exceptions:
          - com.checkbook.client.datanaru.DatanaruResponseException
          - com.checkbook.common.ratelimit.DailyBudgetExceededException

# 공급자 예산 DB 동기화는 테스트가 직접 부른다 — 컨텍스트마다 도는 스케줄이 테스트 행과 섞이지 않게 사실상 끈다
rate-limit:
  sync-interval-ms: 3600000
