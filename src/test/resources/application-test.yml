spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# 외부 API 키는 비면 기동이 멈춘다(@NotBlank). 테스트는 실제 호출을 하지 않으니 더미 값을 둔다
kakao:
  book:
    rest-api-key: test-key

yes24:
  api-key: test-key

datanaru:
  auth-key: test-key
  base-url: https://data4library.kr/api
  timeout: 2000

search:
  total-deadline: 2800
  public-library-page-size: 5
  public-library-max-count: 20
  public-library-fanout-timeout: 2200
  # 부하 사이징과 무관 — 테스트 컨텍스트용으로 의도적으로 작게 유지 (운영 값은 application.yaml)
  executor-pool-size: 3
  executor-queue-capacity: 8

public-library:
  bootstrap-enabled: false
  executor-pool-size: 20
  executor-queue-capacity: 20

elibrary:
  thread-pool-size: 5
  queue-capacity: 10
  per-library-timeout: 15000
  total-timeout: 20000

cors:
  allowed-origins: http://localhost:3000

resilience4j:
  circuitbreaker:
    instances:
      datanaru:
        sliding-window-size: 2
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
        permitted-calls-in-half-open-state: 1
        ignore-exceptions:
          - com.checkbook.client.datanaru.DatanaruResponseException
          - com.checkbook.common.ratelimit.DailyBudgetExceededException
