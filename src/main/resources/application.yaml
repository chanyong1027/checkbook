spring:
  application:
    name: checkbook
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checkbook}
    username: ${DB_USERNAME:checkbook}
    password: ${DB_PASSWORD:checkbook}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    max-http-header-size: 65536

aladin:
  ttb-key: ${ALADIN_TTB_KEY:}
  base-url: https://www.aladin.co.kr/ttb/api
  identification-timeout: 500
  timeout: 2000

kakao:
  book:
    rest-api-key: ${KAKAO_BOOK_REST_API_KEY:}
    base-url: https://dapi.kakao.com
    timeout: 3000

datanaru:
  auth-key: ${DATANARU_AUTH_KEY:}
  base-url: https://data4library.kr/api
  timeout: 2000
  list-timeout: 90000

millie:
  base-url: https://live-api.millie.co.kr
  timeout: 2000

search:
  total-deadline: 2800
  public-library-top-n: 20
  public-library-fanout-timeout: 2200
  # 3태스크/요청(usedBook·publicLibrary부모·millie) × 목표 동시 요청 4건.
  # baseline 실측(2026-07-03, 하네스 v2): 이 풀(구 3)이 1차 병목 —
  # FAILED율 절벽 VU8(0.8%)↔VU12(97.8%), VU15 종료 시점 유령 큐 470 (notes/todo/benchmark-results.md §4)
  executor-pool-size: 12
  # 큐 = 풀(12)의 2배 — 무제한 큐의 "유령 작업 62초" 병리 차단, 데드라인 내 소화 가능량만 수용
  executor-queue-capacity: 24

public-library:
  bootstrap-enabled: false
  # fan-out 20/요청 × 동시 요청 2건 full-width. baseline에선 이 풀이 아니라 searchExecutor가
  # 병목이었으나(incomplete 0%), 상류 확장(3→12) 후의 2차 병목 대비
  executor-pool-size: 40
  # 큐 = (fan-out 윈도 2.2s − 자식 처리 p50 0.36s) × 소화속도(40스레드÷0.36s ≈ 111/s) ≈ 200 —
  # "기다리면 윈도 내 완주 가능한" 버스트만 수용, 그 밖은 거절. 40으로는 정상 부하(VU12)에서도
  # 도서관 스킵 85%(incomplete) 발생을 실측 — 과소 용량은 데이터 유실로 나타난다.
  # p50 0.36s = datanaru bookExist EC2 실측(주·야간 355~356ms) — WireMock도 동 분포로 캘리브레이션.
  # 윈도(fanout-timeout)나 운영 p50이 변하면 이 큐도 재산정 대상.
  executor-queue-capacity: 200

elibrary:
  thread-pool-size: 5
  queue-capacity: 25
  per-library-timeout: 15000
  total-timeout: 20000

async:
  # abort — fault A/B 실측으로 확정 (2026-07-04): callerRuns는 FAILED 15.8%·max 41.5s·처리량 43%
  # (인라인 실행이 제출 루프와 데드라인 예산을 점유). abort는 FAILED 0.05%·부분 결과로 우아한 열화.
  rejection-policy: abort

featured:
  page-size: 15
  bestseller:
    cron: "0 0 4 * * MON"
    ttl-hours: 168
  new:
    cron: "0 0 4 * * MON,THU"
    ttl-hours: 84
  loan:
    cron: "0 0 4 * * MON"
    ttl-hours: 168

rate-limit:
  requests-per-minute: 30

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.checkbook: INFO
    com.checkbook.client: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      datanaru:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.checkbook.client.datanaru.DatanaruResponseException
