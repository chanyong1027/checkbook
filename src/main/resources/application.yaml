spring:
  application:
    name: checkbook
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checkbook}
    username: ${DB_USERNAME:checkbook}
    password: ${DB_PASSWORD:checkbook}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080
  forward-headers-strategy: framework

kakao:
  book:
    # 필수 키. 비면 기동이 멈춘다(@NotBlank). 빈 기본값은 지우지 않는다 — 이유는 yes24.api-key 주석
    rest-api-key: ${KAKAO_BOOK_REST_API_KEY:}
    base-url: https://dapi.kakao.com
    # EC2 4세션 실측(n=400): p99 173ms, max 250ms — 구 3000ms의 근거("가끔 1.5~2s")는 미재현으로
    # 폐기. 1000ms = max의 4배 여유 (connect/read 각각 적용 — 이론적 최악 2s).
    # 별도 후보검색 엔드포인트(식별 실패 시 프론트가 호출하는 UX 폴백)라 과도하게 조이지 않음
    timeout: 1000

datanaru:
  # 필수 키. 비면 기동이 멈춘다(@NotBlank). 빈 기본값은 지우지 않는다 — 이유는 yes24.api-key 주석
  auth-key: ${DATANARU_AUTH_KEY:}
  base-url: https://data4library.kr/api
  timeout: 2000
  list-timeout: 90000

millie:
  base-url: https://live-api.millie.co.kr
  timeout: 2000
  # 밀리가 경로 버전을 바꾸면 여기만 고쳐 재배포한다. 옛 상세 주소(v3)도 200 빈 페이지를 줘서 상태 코드로는 안 잡힌다 —
  # 바뀌었는지는 페이지 제목(책 이름)으로 확인한다(10-18). 주 1회 contract-check.yml(MillieContractTest)이 이 값으로 확인한다
  search-path: /v3/search/total
  detail-url-base: https://www.millie.co.kr/v4/book/

yes24:
  # 필수 키. 비면 기동이 멈춘다(@NotBlank). ${X:}의 빈 기본값은 env가 없을 때 ""를 넣어 @NotBlank가 잡게 하려는 것 —
  # 지우면 해석 못 한 "${X}"가 글자 그대로 바인딩돼 검증을 통과한다
  api-key: ${YES24_KEY:}
  base-url: https://apis.yes24.com
  # 식별은 fan-out 전에 순차 실행돼 최악 응답 시간에 그대로 더해진다. 재시도 없음.
  # 예산 700ms(로컬 실측 p95 327ms의 약 2배, T1 결정 카드 4).
  # read-timeout = 요청 전송~본문 끝까지의 전체 마감(JdkClientHttpRequestFactory), connect-timeout = 그 안의 연결 단계 상한.
  # 실제 분포는 http.client.requests로 관측하고 OCI 오사카에서 다시 재서 조정
  connect-timeout: 200ms
  read-timeout: 700ms
  # 메인 추천 배치(베스트셀러·신간 목록) 전용 전체 마감. 사용자 응답 예산과 무관하다.
  # 로컬 실측 0.21~0.48s(4건, pageSize=30)의 약 6배. 짧아서 실패하면 다음 cron까지 지난 목록이 남는다(PR-3 결정 카드 4)
  list-read-timeout: 3s

search:
  total-deadline: 2800
  public-library-page-size: 5    # 최초 조회와 더보기 1회당 fan-out 수
  public-library-max-count: 20   # 더보기로 접근 가능한 최대 후보 수 = findNearest 상한
  public-library-fanout-timeout: 2200
  # PR-2: 최대 2태스크/요청(publicLibrary부모·millie). 중고는 로컬 링크 생성만 하므로 제출하지 않는다.
  # baseline 실측(2026-07-03, 하네스 v2): 이 풀(구 3)이 1차 병목 —
  # FAILED율 절벽 VU8(0.8%)↔VU12(97.8%), VU15 종료 시점 유령 큐 470 (notes/todo/benchmark-results.md §4)
  executor-pool-size: 12
  # 큐 = 풀(12)의 2배 — 무제한 큐의 "유령 작업 62초" 병리 차단, 데드라인 내 소화 가능량만 수용
  executor-queue-capacity: 24

public-library:
  bootstrap-enabled: false
  # fan-out 20/요청 × 동시 요청 2건 full-width. baseline에선 이 풀이 아니라 searchExecutor가
  # 병목이었으나(incomplete 0%), 상류 확장(3→12) 후의 2차 병목 대비
  executor-pool-size: 40
  # 큐 = (fan-out 윈도 2.2s − 자식 처리 p50 0.36s) × 소화속도(40스레드÷0.36s ≈ 111/s) ≈ 200 —
  # "기다리면 윈도 내 완주 가능한" 버스트만 수용, 그 밖은 거절. 40으로는 정상 부하(VU12)에서도
  # 도서관 스킵 85%(incomplete) 발생을 실측 — 과소 용량은 데이터 유실로 나타난다.
  # p50 0.36s = datanaru bookExist EC2 실측(주·야간 355~356ms) — WireMock도 동 분포로 캘리브레이션.
  # 윈도(fanout-timeout)나 운영 p50이 변하면 이 큐도 재산정 대상.
  executor-queue-capacity: 200

elibrary:
  thread-pool-size: 5
  queue-capacity: 25
  per-library-timeout: 15000
  total-timeout: 20000

async:
  # abort — fault A/B 실측으로 확정 (2026-07-04): callerRuns는 FAILED 15.8%·max 41.5s·처리량 43%
  # (인라인 실행이 제출 루프와 데드라인 예산을 점유). abort는 FAILED 0.05%·부분 결과로 우아한 열화.
  rejection-policy: abort

featured:
  page-size: 15
  bestseller:
    cron: "0 0 4 * * MON"
    ttl-hours: 168
  new:
    cron: "0 0 4 * * MON,THU"
    ttl-hours: 84
  loan:
    cron: "0 0 4 * * MON"
    ttl-hours: 168

# 요청 제한 (결정 카드 2026-10-18). IP별 한도는 인메모리라 재시작·블루그린 전환 때 0부터 다시 센다.
# 공급자 예산은 DB(external_call_budget)와 주기적으로 맞춰 이어서 센다
rate-limit:
  enabled: true
  sync-interval-ms: 10000   # 공급자 예산 DB 동기화 주기. 다른 칸 사용량이 이만큼 늦게 보인다(차단선 여유로 흡수)
  client:
    # IP(IPv6는 /64) 하나의 하루 요청 수 — /api/search·도서관 더보기·후보 검색·전자도서관 검색 합산.
    # 책 한 권 ≈ 3~4회라 약 125~170권. IP 하나가 쓸 수 있는 YES24는 최대 500(한도의 2.5%)
    daily-limit: 500
    max-tracked-clients: 200000
  # daily-limit = 공급자 실제 하루 한도(80% 경고·잔량 헤더 환산 기준), block-at = 사용자 요청 호출을 막기 시작하는 사용량
  providers:
    yes24:
      daily-limit: 20000
      block-at: 19000      # 배치(추천 목록) 몫과 재시작 오차 여유. 응답 헤더 잔량을 받으면 그 값으로 맞춘다
    datanaru:
      daily-limit: 30000
      block-at: 28500      # 스냅샷(24h) 적중은 호출이 아니라 세지 않는다
    millie:
      daily-limit: 20000   # 공개 한도 없음(비공식 API) — 폭주를 막는 자체 상한. 검색당 1회라 YES24와 같은 규모
      block-at: 20000
    kakao:
      daily-limit: 30000   # 책 검색 일간 쿼터(카카오디벨로퍼스 쿼터 문서, 10-18 확인)
      block-at: 27000
  elibrary-per-library-limit: 1000   # 전자도서관 사이트 하나당 하루 수집 상한(공개 한도 없음, 작은 사이트 보호)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  # 지연 분포(p99 등)는 Grafana에서 구간 수로 계산한다. 구간 수 = 시리즈 수라 무료 한도(활성 1만, 블루·그린 전환 중 2배)에 맞춰
  # 외부 호출은 기본 구간(1ms~30s, 68개)을 10ms~10s(46개)로 좁히고, 서버 요청은 판단에 쓰는 경계만 둔다(알림경로 결정 카드 2026-10-19)
  # 설정은 이름 앞부분으로 걸려 진행 중 요청 타이머(<이름>.active)까지 물려받는다 — 그쪽은 수만 보면 되니 구간을 끈다
  metrics:
    distribution:
      percentiles-histogram:
        "[http.client.requests]": true
        "[http.client.requests.active]": false
      minimum-expected-value:
        "[http.client.requests]": 10ms
      maximum-expected-value:
        "[http.client.requests]": 10s
      # 200ms 정상 응답, 700ms YES24 식별 예산, 1·2s 느림, 2800ms 검색 전체 마감(search.total-deadline)
      slo:
        "[http.server.requests]": 200ms,700ms,1s,2s,2800ms
        "[http.server.requests.active]": ""

logging:
  level:
    com.checkbook: INFO
    com.checkbook.client: DEBUG

resilience4j:
  ratelimiter:
    instances:
      # YES24 한도는 초당 10·일 20,000. 100ms마다 1건, 대기 없이 즉시 거절(주기 경계 몰림 방지, T1 결정 E3).
      # 우리 주기는 YES24의 1초 경계와 맞춰져 있지 않아 임의의 1초 창에 최대 11건이 나갈 수 있다 —
      # 429(RATE_001)를 완전히 막지 못하므로 계속 처리한다. 식별과 추천 배치가 같은 인스턴스를 쓴다
      yes24:
        limit-refresh-period: 100ms
        limit-for-period: 1
        timeout-duration: 0
  circuitbreaker:
    instances:
      datanaru:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.checkbook.client.datanaru.DatanaruResponseException
          # 예산 소진은 호출을 안 한 것이라 정보나루 장애가 아니다 — 실패로 세면 서킷이 열린다
          - com.checkbook.common.ratelimit.DailyBudgetExceededException
